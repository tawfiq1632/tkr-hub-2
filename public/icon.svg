<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Deep Navy Solid Background -->
  <rect width="500" height="500" rx="48" fill="#0B132B" />

  <!-- Subtle Ambient Glow -->
  <defs>
    <linearGradient id="tkrGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC066" />
      <stop offset="50%" stop-color="#CFA035" />
      <stop offset="100%" stop-color="#B88A22" />
    </linearGradient>
    <linearGradient id="tkrFacetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DC8E" />
      <stop offset="100%" stop-color="#DFC066" />
    </linearGradient>
  </defs>

  <!-- Central TKR Sovereign Monogram -->
  <g transform="translate(0, 5)">
    <!-- Top Roof Bar of 'T' -->
    <path d="M 194 135 L 336 135 L 330 152 L 244 152 L 244 153 L 202 153 Z" fill="url(#tkrGoldGrad)" />

    <!-- Left Stem of 'T' -->
    <rect x="221" y="152" width="23" height="116" fill="url(#tkrGoldGrad)" />

    <!-- Upper Loop of 'R' Outer Boundary -->
    <path d="M 244 152 L 298 152 C 324 152 334 165 334 185 C 334 206 322 219 296 219 L 244 219 Z" fill="url(#tkrGoldGrad)" />
    
    <!-- Upper Loop Inner Hole (matches background) -->
    <path d="M 244 167 L 294 167 C 309 167 315 174 315 185 C 315 197 308 204 294 204 L 244 204 Z" fill="#0B132B" />

    <!-- Lower Diagonal Leg of 'R' -->
    <path d="M 252 216 L 285 216 L 334 268 L 306 268 Z" fill="url(#tkrGoldGrad)" />

    <!-- Geometric Light Facet on Diagonal Leg -->
    <polygon points="266,220 292,220 274,242 248,242" fill="url(#tkrFacetLight)" opacity="0.95" />
    <polygon points="274,242 298,242 284,260 260,260" fill="url(#tkrFacetLight)" opacity="0.75" />
  </g>

  <!-- Typography: T K R -->
  <text x="254" y="348" font-family="'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="12">
    TKR
  </text>

  <!-- Typography: H O L D I N G S -->
  <text x="252" y="380" font-family="'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#CFA035" text-anchor="middle" letter-spacing="9">
    HOLDINGS
  </text>
</svg>
